[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mono-imager"
# Version is the single source of truth in mono_imager/__init__.py
# setuptools reads it dynamically — no manual version bump needed here.
dynamic = ["version"]
description = "Automated firmware flashing for Mono Gateway Routers and Dev Kit"
readme = "README.md"
authors = [{name = "H.A. Hermsen"}]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
include = ["mono_imager*"]

[tool.setuptools.dynamic]
version = {attr = "mono_imager.__version__"}

[project.scripts]
mono-imager = "mono_imager.cli:main"

[project.optional-dependencies]
# zstd for LAN eMMC snapshots on Python < 3.14 (3.14+ has compression.zstd; gzip otherwise)
zstd = ["zstandard>=0.22; python_version < '3.14'"]
dev = [
    "pytest>=7",
    # pinned: tests/unit/test_lint_baseline.py compares counts measured with these versions
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-pyserial",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# the Python the app runs on (3.14): the lint baseline is measured for it
python_version = "3.14"
